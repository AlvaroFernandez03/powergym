<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <div class="logo">Power<span>Gym</span></div>
    <nav>
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="clases.html">Clases</a></li>
        <li><a href="monitores.html">Monitores</a></li>
        <li><a href="programas.html">Programas</a></li>
        <li><a href="imc.html">Calculadora IMC</a></li>
        <li><a href="entrenador-ia.html">Entrenador IA</a></li>
        <li><a href="peticiones.html">Peticiones</a></li>
        <li><a href="instalaciones.html">Instalaciones</a></li>
        <li id="nav-admin-link" class="hidden"><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
    <div class="user-area" id="nav-user-area"></div>
  </div>
</header>

<section class="form-box">
  <h2>Calculadora de IMC</h2>
  <form id="imc-form">
    <div class="field">
      <label for="altura">Altura (cm)</label>
      <input type="number" id="altura" step="0.1" placeholder="Ej: 175" required>
    </div>
    <div class="field">
      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" step="0.1" placeholder="Ej: 70" required>
    </div>
    <button type="submit" class="btn btn-primary">Calcular</button>
  </form>
  <div id="imc-result" class="imc-result hidden"></div>
</section>

<footer>
  <div class="bar-divider">
    <span class="plate red"></span><span class="plate blue"></span><span class="plate yellow"></span><span class="plate green"></span>
  </div>
  <div class="footer-brand">PowerGym</div>
  <p class="copy">© 2026 POWERGYM — PROYECTO DE PRÁCTICA / PORTFOLIO</p>
</footer>
<script src="js/auth.js"></script>
<script src="js/imc.js"></script>
</body>
</html>
