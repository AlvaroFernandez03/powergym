<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerGym | Registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <div class="logo">Power<span>Gym</span></div>
    <nav>
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="clases.html">Clases</a></li>
        <li><a href="monitores.html">Monitores</a></li>
        <li><a href="programas.html">Programas</a></li>
        <li><a href="imc.html">Calculadora IMC</a></li>
        <li><a href="entrenador-ia.html">Entrenador IA</a></li>
        <li><a href="peticiones.html">Peticiones</a></li>
        <li><a href="instalaciones.html">Instalaciones</a></li>
        <li id="nav-admin-link" class="hidden"><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
    <div class="user-area" id="nav-user-area"></div>
  </div>
</header>

<section class="form-box">
  <h2>Crear cuenta</h2>
  <form id="register-form">
    <div class="field">
      <label for="name">Nombre</label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Contraseña (mín. 6 caracteres)</label>
      <input type="password" id="password" minlength="6" required>
    </div>
    <button type="submit" class="btn btn-primary">Registrarme</button>
    <p id="form-msg" class="form-message"></p>
  </form>
  <p style="margin-top:16px;">¿Ya tienes cuenta? <a href="login.html" style="color:var(--color-primary);">Inicia sesión</a></p>
</section>

<footer>
  <div class="bar-divider">
    <span class="plate red"></span><span class="plate blue"></span><span class="plate yellow"></span><span class="plate green"></span>
  </div>
  <div class="footer-brand">PowerGym</div>
  <p class="copy">© 2026 POWERGYM — PROYECTO DE PRÁCTICA / PORTFOLIO</p>
</footer>
<script src="js/auth.js"></script>
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("form-msg");
  msg.textContent = "";
  msg.className = "form-message";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const data = await apiFetch("/auth/register", {
      method: "POST",
      body: JSON.stringify({ name, email, password }),
    });
    saveSession(data.token, data.user);
    window.location.href = "area-personal.html";
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add("error");
  }
});
</script>
</body>
</html>
